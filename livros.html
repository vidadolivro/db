<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bibliografia — vida do livro</title>
  <style>
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/haas-grot-text-r-55-roman.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/haas-grot-text-r-56-italic.woff2') format('woff2');
      font-weight: 400; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/haas-grot-text-r-65-medium.woff2') format('woff2');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Haas Grotesk';
      src: url('fonts/haas-grot-text-r-76-bold-italic.woff2') format('woff2');
      font-weight: 700; font-style: italic; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Haas Display';
      src: url('fonts/haas-grot-disp-r-web-55-roman.woff2') format('woff2');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Neue Haas Display';
      src: url('fonts/haas-grot-disp-r-web-76-bold-italic.woff2') format('woff2');
      font-weight: 700; font-style: italic; font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Mesmos valores de referencias.html — quando a terceira página (diretórios)
       entrar, isto vira um arquivo compartilhado. Duas cópias ainda dá pra
       manter na cabeça; três, não. */
    :root {
      --bg: #fafaf8;
      --ink: #111;
      --light: #57544b;
      --border: #ddd;
      --mono: "Courier New", Courier, monospace;
      --sans: "Neue Haas Grotesk", Helvetica, -apple-system, system-ui, sans-serif;
      --display: "Neue Haas Display", "Neue Haas Grotesk", Helvetica, sans-serif;
      --card: #ffed00;
      --card-ink: #111;
      --card-sub: #3d3a00;
      --gap: 16px;
    }
    :root[data-theme="dark"] { --card: #dcd400; --card-sub: #3a3600; }

    html, body { overflow-x: clip; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 0 28px; }

    nav.top {
      display: flex; justify-content: center; gap: 42px;
      padding: 22px 0 0; font-size: 14px;
    }
    nav.top a { color: var(--light); }
    nav.top a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    nav.top a[aria-current="page"] { color: var(--ink); }

    .hero { text-align: center; padding: 34px 0 26px; }
    .wordmark {
      font-family: var(--display);
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1;
      text-transform: lowercase;
    }

    .filtros { padding-bottom: 22px; }
    .busca-linha { display: flex; justify-content: center; margin-bottom: 20px; }
    .busca {
      font-family: var(--sans); font-size: 14px;
      width: 100%; max-width: 420px; padding: 9px 14px;
      border: 1px solid var(--border); border-radius: 999px;
      background: transparent; color: var(--ink); outline: none; text-align: center;
    }
    .busca:focus { border-color: var(--ink); }
    .busca::placeholder { color: var(--light); }

    .nuvem {
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: 8px; padding: 5px 0;
    }
    .nuvem--macro { margin-bottom: 6px; }
    .chip {
      font-family: var(--sans); font-size: 11.5px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      height: 25px; padding: 2px 11px 0;
      border-radius: 999px; border: 1px solid transparent;
      background: var(--chip, #eee); color: #111;
      cursor: pointer; white-space: nowrap;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .chip:hover { box-shadow: 0 0 0 1px var(--ink); }
    .chip[aria-pressed="true"] { border-color: #111; box-shadow: 0 0 0 1.5px #111; font-weight: 700; }
    .chip[data-grupo="macro"] { border-color: rgba(0,0,0,0.55); }
    :root[data-theme="dark"] .chip { filter: saturate(0.9) brightness(0.94); }

    .resultado {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; padding: 14px 0 10px; margin-bottom: 14px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--light);
    }
    .resultado[hidden] { display: none; }
    .limpar {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; background: none; border: none;
      border-bottom: 1px solid currentColor; color: var(--ink); cursor: pointer; padding: 0 0 1px;
    }

    .grade { display: flex; align-items: flex-start; gap: var(--gap); }
    .coluna { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }

    /* ── CARD DE LIVRO ──
       A capa entra como objeto dentro do card amarelo, com sombra, e sem
       proporção forçada: o catálogo tem capa 2:3, quadrada e 128px, e cortar
       tudo no mesmo talho mutilaria arte de capa. */
    .card {
      background: var(--card); color: var(--card-ink);
      border-radius: 12px; padding: 14px 14px 12px;
      display: flex; flex-direction: column;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .card--link { cursor: pointer; }
    .card--link:hover { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.22); }
    .capa {
      width: 100%; height: auto; display: block;
      border-radius: 3px; box-shadow: 0 3px 10px rgba(0,0,0,0.28);
      background: #efece3;
    }
    .sem-capa {
      aspect-ratio: 2/3; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 14px; border-radius: 3px; background: #efece3;
      font-family: var(--display); font-style: italic; font-weight: 700;
      font-size: 15px; line-height: 1.1; color: #55524a;
    }
    .corpo { padding-top: 12px; display: flex; flex-direction: column; flex: 1; }
    .tit {
      font-family: var(--display); font-size: 17px; font-weight: 700; font-style: italic;
      line-height: 1.03; letter-spacing: -0.022em; text-wrap: pretty;
    }
    .aut { font-size: 13px; font-weight: 700; font-style: italic; line-height: 1.15; margin-top: 3px; }
    .meta { font-size: 11.5px; margin-top: 5px; color: var(--card-sub); }
    .tags {
      display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end;
      margin-top: auto; padding-top: 12px;
    }
    .pill {
      font-size: 10.5px; font-weight: 500; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      height: 23px; padding: 2px 10px 0;
      border-radius: 999px; background: var(--chip, #fff); color: #111;
      cursor: pointer; border: 1px solid rgba(0,0,0,0.14);
    }
    .pill:hover { border-color: #111; }
    .pill[data-macro] { border-color: rgba(0,0,0,0.55); }

    @keyframes card-entra {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }
    .card--entra {
      animation-name: card-entra; animation-duration: 0.34s;
      animation-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1);
      animation-fill-mode: backwards;
    }
    @media (prefers-reduced-motion: reduce) { .card--entra { animation: none; } }

    .vazio { text-align: center; padding: 60px 0; color: var(--light); }
    footer {
      border-top: 1px solid var(--border); padding: 16px 0; margin-top: 40px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
      color: var(--light); display: flex; justify-content: space-between;
    }
    @media (max-width: 640px) {
      .wrap { padding: 0 16px; }
      nav.top { gap: 20px; font-size: 13px; flex-wrap: wrap; }
      .hero { padding: 24px 0 18px; }
    }
  </style>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
</head>
<body>

<div class="wrap">
  <nav class="top">
    <a href="referencias.html">referências</a>
    <a href="livros.html" aria-current="page">bibliografia</a>
    <a href="diretorio?tipo=editoras">diretórios</a>
  </nav>

  <header class="hero">
    <h1 class="wordmark">vida do livro</h1>
  </header>

  <section class="filtros">
    <div class="busca-linha">
      <input class="busca" id="busca" type="search" placeholder="buscar por título, autor ou editora" autocomplete="off">
    </div>
    <div class="nuvem nuvem--macro" id="nuvem-macro"></div>
    <div class="nuvem" id="nuvem-temas"></div>
  </section>

  <div class="resultado">
    <span id="resumo"></span>
    <button class="limpar" id="limpar" hidden>limpar filtros</button>
  </div>

  <div class="grade" id="grade"></div>

  <footer>
    <span>vida do livro</span>
    <span>bibliografia</span>
  </footer>
</div>

<script src="dados/livros.js"></script>
<script src="dados/temas.js"></script>
<script>
(function () {
  'use strict';

  var LIVROS = (window.LIVROS || []).filter(function (l) { return l.macrotema; });
  var TEMAS = window.TEMAS || {};

  /* mesma roda de cor de referencias.html: o tema tem UMA cor no site inteiro */
  function corDaRoda(h, fundo) {
    var l = 73 + 7 * Math.cos((h - 250) * Math.PI / 180) - (fundo ? 7 : 0);
    return 'hsl(' + Math.round(h) + ', 95%, ' + l.toFixed(1) + '%)';
  }
  var SLUGS = Object.keys(TEMAS), COR_TEMA = {};
  SLUGS.forEach(function (s, i) { COR_TEMA[s] = corDaRoda(i * 360 / SLUGS.length, false); });
  function nomeTema(s) { return (TEMAS[s] && TEMAS[s].titulo) || s.replace(/-/g, ' '); }

  var MACROS = [
    { id: 'historia',     rotulo: 'história' },
    { id: 'experiencias', rotulo: 'experiências' },
    { id: 'escrita',      rotulo: 'escrita' },
    { id: 'design',       rotulo: 'design e técnico' },
    { id: 'marketing',    rotulo: 'marketing' },
    { id: 'diversos',     rotulo: 'diversos' },
  ];
  MACROS.forEach(function (m, i) { m.cor = corDaRoda(i * 60 + 30, true); });
  var MACRO_POR_ID = {};
  MACROS.forEach(function (m) { MACRO_POR_ID[m.id] = m; });

  var porMacro = {}, porTema = {};
  LIVROS.forEach(function (l) {
    porMacro[l.macrotema] = (porMacro[l.macrotema] || 0) + 1;
    (l.temas || []).forEach(function (s) { porTema[s] = (porTema[s] || 0) + 1; });
  });

  var semAcento = function (s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  };
  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  /* a base guarda "Rodrigues, Sérgio" (convenção de catálogo); o card lê melhor
     na ordem natural */
  function autorLegivel(a) {
    return String(a || '').split(' & ').map(function (p) {
      var m = p.split(', ');
      return m.length === 2 ? m[1].trim() + ' ' + m[0].trim() : p.trim();
    }).join(' e ');
  }
  function sobrenome(a) {
    var p = String(a || '').split(' & ')[0];
    return semAcento(p.indexOf(',') > -1 ? p.split(',')[0] : p.split(' ').pop());
  }

  LIVROS.forEach(function (l) {
    l._busca = semAcento([l.titulo, autorLegivel(l.autor), l.editora, l.ano,
      (l.temas || []).map(nomeTema).join(' ')].join(' '));
  });
  LIVROS.sort(function (a, b) {
    var s = sobrenome(a.autor).localeCompare(sobrenome(b.autor), 'pt');
    return s !== 0 ? s : a.titulo.localeCompare(b.titulo, 'pt');
  });

  var sel = { macro: [], temas: [], q: '' };

  function lerURL() {
    var p = new URLSearchParams(location.search);
    sel.macro = (p.get('categoria') || '').split(',').filter(Boolean);
    sel.temas = (p.get('tema') || '').split(',').filter(Boolean);
    sel.q = p.get('q') || '';
  }
  function gravarURL() {
    var p = new URLSearchParams();
    if (sel.macro.length) p.set('categoria', sel.macro.join(','));
    if (sel.temas.length) p.set('tema', sel.temas.join(','));
    if (sel.q) p.set('q', sel.q);
    var qs = p.toString();
    history.replaceState(null, '', qs ? '?' + qs : location.pathname);
  }

  function filtrar() {
    var termos = semAcento(sel.q).trim().split(/\s+/).filter(Boolean);
    return LIVROS.filter(function (l) {
      if (sel.macro.length && sel.macro.indexOf(l.macrotema) === -1) return false;
      if (sel.temas.length && !(l.temas || []).some(function (s) { return sel.temas.indexOf(s) !== -1; })) return false;
      for (var i = 0; i < termos.length; i++) if (l._busca.indexOf(termos[i]) === -1) return false;
      return true;
    });
  }

  function montarCard(l) {
    var el = document.createElement('article');
    var temLink = l.href && l.href !== '#';
    el.className = 'card' + (temLink ? ' card--link' : '');
    if (temLink) el._href = l.href;

    var capa = l.capa
      ? '<img class="capa" loading="lazy" src="' + esc(l.capa) + '" alt="capa de ' + esc(l.titulo) + '"' +
        ' onerror="this.outerHTML=\'<div class=&quot;sem-capa&quot;>' + esc(l.titulo).replace(/'/g, '') + '</div>\'">'
      : '<div class="sem-capa">' + esc(l.titulo) + '</div>';

    var macro = MACRO_POR_ID[l.macrotema];
    var tags = (l.temas || []).map(function (s) {
      return '<span class="pill" data-tema="' + esc(s) + '" style="--chip:' + COR_TEMA[s] + '">' + esc(nomeTema(s)) + '</span>';
    }).join('') +
    (macro ? '<span class="pill" data-macro="' + esc(macro.id) + '" style="--chip:' + macro.cor + '">' + esc(macro.rotulo) + '</span>' : '');

    el.innerHTML = capa +
      '<div class="corpo">' +
        '<h2 class="tit">' + esc(l.titulo) + '</h2>' +
        '<p class="aut">' + esc(autorLegivel(l.autor)) + '</p>' +
        '<p class="meta">' + [esc(l.editora), l.ano].filter(Boolean).join(' · ') + '</p>' +
        '<div class="tags">' + tags + '</div>' +
      '</div>';
    return el;
  }

  /* ── grade em colunas, igual referências ── */
  var grade = document.getElementById('grade');
  var colunas = [], alturas = [], GAP = 16, lista = [];

  function quantasColunas() {
    var w = grade.clientWidth || window.innerWidth;
    return w >= 1360 ? 5 : w >= 1080 ? 4 : w >= 800 ? 3 : w >= 520 ? 2 : 1;
  }
  function zerarColunas() {
    grade.innerHTML = ''; colunas = []; alturas = [];
    for (var i = 0, n = quantasColunas(); i < n; i++) {
      var c = document.createElement('div');
      c.className = 'coluna';
      grade.appendChild(c); colunas.push(c); alturas.push(0);
    }
  }
  function menorColuna() {
    var min = 0;
    for (var i = 1; i < alturas.length; i++) if (alturas[i] < alturas[min]) min = i;
    return min;
  }

  function redesenhar() {
    lista = filtrar();
    grade.style.minHeight = grade.offsetHeight + 'px';
    zerarColunas();
    if (!lista.length) {
      grade.innerHTML = '<p class="vazio">nenhum livro com esses filtros.</p>';
    } else {
      lista.forEach(function (l, i) {
        var el = montarCard(l);
        el.className += ' card--entra';
        el.style.animationDelay = Math.min(i, 16) * 24 + 'ms';
        var c = menorColuna();
        colunas[c].appendChild(el);
        /* a capa ainda não carregou: estimo pela proporção mais comum (2:3),
           senão as primeiras colunas saem desalinhadas na primeira pintura */
        alturas[c] += (el.offsetHeight || 0) + (l.capa ? colunas[c].clientWidth * 1.5 : 0) + GAP;
      });
    }
    grade.style.minHeight = '';

    var filtrando = !!(sel.macro.length || sel.temas.length || sel.q);
    var partes = [];
    if (filtrando) {
      if (sel.macro.length) partes.push(sel.macro.map(function (m) { return (MACRO_POR_ID[m] || {}).rotulo || m; }).join(' + '));
      if (sel.temas.length) partes.push(sel.temas.map(nomeTema).join(' + '));
      if (sel.q) partes.push('“' + sel.q + '”');
    }
    document.getElementById('resumo').textContent = partes.join('  ·  ');
    document.getElementById('limpar').hidden = !filtrando;
    document.querySelector('.resultado').hidden = !filtrando;
    gravarURL();
    document.querySelectorAll('.chip').forEach(function (b) {
      var arr = b.dataset.grupo === 'macro' ? sel.macro : sel.temas;
      b.setAttribute('aria-pressed', arr.indexOf(b.dataset.id) !== -1 ? 'true' : 'false');
    });
  }

  /* recoloca quando as capas terminam de carregar: só aí a altura real existe */
  var pendentes = 0, remonta = null;
  grade.addEventListener('load', function () {
    clearTimeout(remonta);
    remonta = setTimeout(reequilibrar, 120);
  }, true);
  function reequilibrar() {
    var cards = [].slice.call(grade.querySelectorAll('.card'));
    if (!cards.length || !colunas.length) return;
    colunas.forEach(function (c) { c.innerHTML = ''; });
    alturas = alturas.map(function () { return 0; });
    cards.forEach(function (el) {
      var c = menorColuna();
      colunas[c].appendChild(el);
      alturas[c] += el.offsetHeight + GAP;
    });
    void pendentes;
  }

  function montarChip(rotulo, cor, grupo, id, n) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.style.setProperty('--chip', cor);
    b.dataset.grupo = grupo; b.dataset.id = id;
    b.setAttribute('aria-pressed', 'false');
    b.textContent = rotulo;
    b.title = n + (n === 1 ? ' livro' : ' livros');
    b.addEventListener('click', function () {
      var arr = grupo === 'macro' ? sel.macro : sel.temas;
      var i = arr.indexOf(id);
      if (i === -1) arr.push(id); else arr.splice(i, 1);
      redesenhar();
    });
    return b;
  }

  MACROS.forEach(function (m) {
    if (porMacro[m.id]) document.getElementById('nuvem-macro').appendChild(montarChip(m.rotulo, m.cor, 'macro', m.id, porMacro[m.id]));
  });
  SLUGS.forEach(function (s) {
    if (porTema[s]) document.getElementById('nuvem-temas').appendChild(montarChip(nomeTema(s), COR_TEMA[s], 'tema', s, porTema[s]));
  });

  grade.addEventListener('click', function (e) {
    var pill = e.target.closest('.pill');
    if (pill) {
      var grupo = pill.dataset.macro ? 'macro' : 'tema';
      var id = pill.dataset.macro || pill.dataset.tema;
      var arr = grupo === 'macro' ? sel.macro : sel.temas;
      if (arr.indexOf(id) === -1) arr.push(id); else arr.splice(arr.indexOf(id), 1);
      redesenhar();
      return;
    }
    var card = e.target.closest('.card');
    if (card && card._href) window.open(card._href, '_blank', 'noopener');
  });

  var t = null;
  document.getElementById('busca').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(t);
    t = setTimeout(function () { sel.q = v; redesenhar(); }, 140);
  });
  document.getElementById('limpar').addEventListener('click', function () {
    sel.macro = []; sel.temas = []; sel.q = '';
    document.getElementById('busca').value = '';
    redesenhar();
  });

  var rt = null;
  function aoRedimensionar() {
    if (quantasColunas() === colunas.length) return;
    clearTimeout(rt);
    rt = setTimeout(function () { redesenhar(); }, 150);
  }
  if ('ResizeObserver' in window) new ResizeObserver(aoRedimensionar).observe(grade);
  window.addEventListener('resize', aoRedimensionar);

  lerURL();
  document.getElementById('busca').value = sel.q;
  redesenhar();
})();
</script>
</body>
</html>
